site_name: Security Toolbox
site_url: https://security.szolotov.com
site_description: Security checks, best practices and automated guardrails
repo_url: https://github.com/greenblacked/security-toolbox
repo_name: greenblacked/security-toolbox
# Built output goes under build/, never into site/: site/ holds the hand-written
# homepage the Worker serves, and a default build would overwrite it.
site_dir: build/docs
# docs/requirements.txt pins the build tools; it is not a page to publish.
exclude_docs: |
  requirements.txt

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Kubernetes: kubernetes/index.md
  - GCP: gcp/index.md
  - Terraform: terraform/index.md
  - GitHub & CI: github/index.md
  - CI & deploy: ci.md
  - Secrets: secrets/index.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
