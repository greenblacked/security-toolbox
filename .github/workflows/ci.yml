---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A pull request cancels its own superseded runs. Pushes to main never cancel each
# other, so every commit on main keeps a CI result.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: site check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Site HTML is valid enough
        run: |
          set -Eeuo pipefail
          # Minimal check: required files exist
          test -f site/index.html
          test -f deploy/wrangler.json
          echo "site skeleton ok"

  ci:
    name: ci
    needs: [site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: CI gate
        env:
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$SITE_RESULT" != "success" ]]; then
            echo "::error::site check job result: ${SITE_RESULT}"
            exit 1
          fi
          echo "CI passed"
