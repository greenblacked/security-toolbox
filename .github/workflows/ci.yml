---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A pull request cancels its own superseded runs; a push to main never cancels
# another push, so every commit on main keeps a CI result.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # wrangler 4 refuses to run below Node 22.
  NODE_VERSION: '22.23.3'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  site:
    name: site check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Site and Worker files are present
        run: |
          set -Eeuo pipefail
          missing=0
          for file in site/index.html site/404.html site/_headers site/robots.txt \
            site/favicon.svg site/style.css site/theme.js \
            deploy/wrangler.json deploy/package.json deploy/package-lock.json; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file,title=missing file::$file is missing"
              missing=1
            fi
          done
          exit "$missing"
      - name: Pages carry no inline script or style, as site/_headers CSP requires
        run: |
          set -Eeuo pipefail
          bad=0
          for file in site/*.html; do
            if grep -nE '<script>|<script[^>]*>[^<[:space:]]|<style|[[:space:]]style=|[[:space:]]on[a-z]+=' "$file"; then
              echo "::error file=$file,title=inline code::$file has inline script, style or a handler"
              bad=1
            fi
          done
          exit "$bad"

  worker:
    name: worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # node_modules has to come from the lockfile, not a cache entry.
          package-manager-cache: false
      - name: Install the pinned Wrangler from the lockfile
        working-directory: deploy
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          pinned=$(node -p 'require("./package.json").dependencies.wrangler')
          installed=$(./node_modules/.bin/wrangler --version)
          if [ "$installed" != "$pinned" ]; then
            echo "::error::installed wrangler is ${installed}, package.json pins ${pinned}"
            exit 1
          fi
      - name: Check the Worker without deploying it
        working-directory: deploy
        # No credential is named anywhere in this workflow; --dry-run needs none.
        # --no-autoconfig stops framework detection rewriting the project and
        # --no-install-skills keeps the checkout unchanged.
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.json \
            --no-autoconfig --no-install-skills

  ci:
    name: ci
    needs: [site, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: CI gate
        env:
          SITE_RESULT: ${{ needs.site.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$SITE_RESULT" != "success" || "$WORKER_RESULT" != "success" ]]; then
            echo "::error::site check: ${SITE_RESULT}, worker dry-run: ${WORKER_RESULT}"
            exit 1
          fi
          echo "CI passed"
