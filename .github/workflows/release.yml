---
# A merged same-repository stage -> prod PR is the only production trigger.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [prod]

permissions: {}

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  cloudflare:
    name: cloudflare
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'prod' &&
      github.event.pull_request.head.ref == 'stage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Every release deploys and can roll back the same production Worker.
    concurrency:
      group: production-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      WRANGLER_VERSION: '4.166.0'
      WRANGLER_SEND_METRICS: 'false'
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Validate the reviewed merge
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::missing merge commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          # No cache. A release workflow must not restore a dependency
          # cache another run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build the site and guides
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          node scripts/build_site.cjs
      - name: Check the Wrangler pin against the lockfile
        run: |
          set -Eeuo pipefail
          python scripts/check_wrangler_pin.py
      - name: Install Wrangler
        working-directory: deploy
        # No token in this step. --ignore-scripts so a dependency script does not
        # run in the job that is about to receive one.
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          installed=$(./node_modules/.bin/wrangler --version)
          if [ "$installed" != "$WRANGLER_VERSION" ]; then
            echo "::error::installed wrangler is ${installed}, pin is ${WRANGLER_VERSION}"
            exit 1
          fi
      - name: Record the version production is serving
        id: active
        working-directory: deploy
        # The rollback below returns to exactly this version. Without an ID,
        # wrangler rollback picks the version uploaded before the newest one, which
        # after an earlier failed release is that failed release.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set CLOUDFLARE_PROD_API_TOKEN or CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            echo "::error::CLOUDFLARE_ACCOUNT_ID may also be a variable (docs/ci.md)"
            exit 1
          fi
          status="$RUNNER_TEMP/deployment-status.json"
          errors="$RUNNER_TEMP/deployment-status.err"
          if ./node_modules/.bin/wrangler deployments status --config wrangler.json --json \
            >"$status" 2>"$errors"; then
            if ! python "$GITHUB_WORKSPACE/scripts/read_wrangler_deploy.py" --active "$status" \
              >> "$GITHUB_OUTPUT"; then
              echo "::error::production is not serving one version in full"
              echo "::error::not deploying without a version to roll back to"
              exit 1
            fi
          elif grep -qE 'has no deployments|\[code: 10007\]' "$errors"; then
            # The first release: nothing serves yet, so there is nothing to return to.
            echo "::warning::Worker security has no production deployment yet"
            echo "::warning::if this first release fails its checks it cannot roll back"
          else
            cat "$errors" >&2
            echo "::error::could not read the version production is serving"
            echo "::error::not deploying without a version to roll back to"
            exit 1
          fi
      - name: Write the release version marker
        # site/version.txt is not committed. The smoke test fetches it from
        # workers.dev to confirm this merge's assets are what the Worker serves.
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$RELEASE_SHA" > site/version.txt
      - name: Refuse a superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "::error::prod moved since this PR was merged; refusing to deploy an older revision"
            exit 1
          fi
      - name: Deploy the production Worker
        id: deploy
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set CLOUDFLARE_PROD_API_TOKEN or CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            echo "::error::CLOUDFLARE_ACCOUNT_ID may also be a variable (docs/ci.md)"
            exit 1
          fi
          # Recorded before the deploy, not after: Wrangler makes the new version active
          # before it attaches the custom domain, so a failure after that point would
          # otherwise leave the new version live with no rollback.
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          ./node_modules/.bin/wrangler deploy --config wrangler.json \
            --no-autoconfig --no-install-skills \
            --message "release ${RELEASE_SHA:0:7}" --tag "$GIT_SHA"
          python "$GITHUB_WORKSPACE/scripts/read_wrangler_deploy.py" \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the production Worker
        id: smoke
        # Bot Fight Mode on the zone can answer a GitHub runner's request for
        # security.szolotov.com with a 403, and no WAF rule can skip it, so the
        # blocking check goes to the Worker's workers.dev address, which sits
        # outside the zone. The same deployment serves both addresses; the next
        # step proves it. vars.DEPLOY_URL is not smoked: it names the custom
        # domain, so fetching it would put the 403 back.
        env:
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.url }}
          CUSTOM_URL: ${{ steps.deploy.outputs.custom_url }}
        run: |
          set -Eeuo pipefail
          production_url=https://security.szolotov.com
          if [ -z "$WORKERS_DEV_URL" ]; then
            echo "::error::Wrangler reported no workers.dev address for this deploy"
            echo "::error::workers_dev must stay true in deploy/wrangler.json (docs/ci.md)"
            exit 1
          fi
          if [ "$CUSTOM_URL" != "$production_url" ]; then
            echo "::error::Wrangler did not report ${production_url} for this deploy"
            echo "::error::reported custom domain: '${CUSTOM_URL}'; it was not attached"
            exit 1
          fi
          scripts/smoke_site.sh "$WORKERS_DEV_URL" "$RELEASE_SHA"
      - name: Confirm production serves the deployed version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        working-directory: deploy
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set CLOUDFLARE_PROD_API_TOKEN or CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            echo "::error::CLOUDFLARE_ACCOUNT_ID may also be a variable (docs/ci.md)"
            exit 1
          fi
          if [ -z "$DEPLOYED_VERSION_ID" ]; then
            echo "::error::cannot confirm what production is serving"
            echo "::error::the deploy log did not report a version ID"
            exit 1
          fi
          status="$RUNNER_TEMP/deployment-status-after.json"
          if ! ./node_modules/.bin/wrangler deployments status --config wrangler.json --json \
            >"$status"; then
            echo "::error::could not read the version production is serving"
            exit 1
          fi
          if ! python "$GITHUB_WORKSPACE/scripts/read_wrangler_deploy.py" \
            --active-is "$DEPLOYED_VERSION_ID" "$status"; then
            echo "::error::production is not serving ${DEPLOYED_VERSION_ID} at 100%"
            exit 1
          fi
      - name: Check the production custom domain
        # A 403 from the zone is logged as a notice and never fails the job:
        # failure here after a good deploy would roll production back for nothing.
        run: |
          set -Eeuo pipefail
          production_url=https://security.szolotov.com
          code=$(curl --silent --output /dev/null --max-time 20 \
            --write-out '%{http_code}' "${production_url}/" || true)
          echo "GET ${production_url}/ answered HTTP ${code:-none}"
          if [ "$code" = 403 ]; then
            echo "::notice::Bot Fight Mode blocks GitHub runners on security.szolotov.com," \
              "so this release was verified through workers.dev and the active deployment"
          fi
      - name: Roll back the production Worker
        if: failure() && steps.deploy.outputs.deployed == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.active.outputs.version_id }}
        run: |
          set -Eeuo pipefail
          echo "::warning::the production deploy did not pass its checks; rolling back"
          if [ -z "$PREVIOUS_VERSION_ID" ]; then
            echo "::error::no version was serving before this release, so there is none to"
            echo "::error::roll back to. Fix forward, or roll back from the Cloudflare dashboard"
            exit 1
          fi
          if ! ./node_modules/.bin/wrangler rollback "$PREVIOUS_VERSION_ID" \
            --config wrangler.json --yes \
            --message "Automatic rollback: failed release check in run ${GITHUB_RUN_ID}"; then
            echo "::error::rollback failed. The failed version may still be serving"
            echo "::error::roll it back from the Cloudflare dashboard"
            exit 1
          fi
