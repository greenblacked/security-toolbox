---
name: Cut release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Latest CHANGELOG version, X.Y.Z (leave empty to derive it)'
        required: false
        type: string

permissions: {}

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Require main
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::cut releases from main"
            exit 1
          fi
      - name: Verify exact promotion and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid commit SHA"
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::release commit is not the current main HEAD"
            exit 1
          fi
          prs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100")
          promotion=$(jq -ce --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
            [ .[][] | select(.state == "closed" and
              (.merged_at | type == "string" and length > 0) and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .head.repo.full_name == $repo and .merge_commit_sha == $sha and
              (.head.ref == "stage" or
               (.head.ref | test("^promotion/stage-to-main-[0-9a-f]{40}$")))) ] |
            if length == 1 then .[0] else error("expected exactly one promotion PR") end
          ' <<< "$prs")
          ref=$(jq -r .head.ref <<< "$promotion")
          head=$(jq -r .head.sha <<< "$promotion")
          if [ "$ref" = stage ]; then
            stage_sha=$head
          else
            stage_sha=${ref#promotion/stage-to-main-}
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$stage_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid promotion SHA"; exit 1;
          }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$stage_sha...stage" --jq .status)
          case "$status" in ahead|identical) ;; *) echo "::error::recorded commit is not reachable on stage"; exit 1 ;; esac
          stage_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$stage_sha" --jq .tree.sha)
          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)
          merge_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          if [ "$stage_tree" != "$head_tree" ] || [ "$stage_tree" != "$merge_tree" ]; then
            echo "::error::promotion source or merged tree differs from recorded stage"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate version and prepare notes
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          version=$(python scripts/release_notes.py latest)
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "::error::requested version must match latest CHANGELOG version $version"
            exit 1
          fi
          python scripts/release_notes.py check-tags "$version"
          python scripts/release_notes.py notes "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create or verify annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          tag="v$VERSION"
          # Fetch refs before testing. Failure to contact origin fails closed.
          git fetch --force --tags origin
          move_tag=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            type=$(git cat-file -t "refs/tags/$tag")
            target=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$type" = tag ] && [ "$target" = "$GITHUB_SHA" ]; then
              echo "::notice::$tag already points at this commit; retrying dispatch"
            else
              # A tag cut before the last promotion merged pins production to
              # superseded content: release.yml deploys the tagged commit and refuses
              # to run once main has moved past it. While the release is unpublished
              # the tag is only a label, so move it to this commit. Once published it
              # is immutable: bump the CHANGELOG instead of rewriting a release.
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "::error::$tag is already published at $target and cannot be moved"
                echo "::error::bump the CHANGELOG version, merge it to main, and release again"
                exit 1
              fi
              echo "::warning::$tag points at $target, not $GITHUB_SHA; moving the unpublished tag"
              move_tag=true
            fi
          fi
          if [ "$move_tag" = true ] || ! git show-ref --verify --quiet "refs/tags/$tag"; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$current" = "$GITHUB_SHA" || { echo "::error::main moved"; exit 1; }
            python - "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/tag.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          notes, request = sys.argv[1:]
          actor = os.environ["ACTOR"]
          body = {
              "tag": "v" + os.environ["VERSION"],
              "message": Path(notes).read_text(encoding="utf-8").rstrip("\n") + "\n",
              "object": os.environ["GITHUB_SHA"],
              "type": "commit",
              "tagger": {"name": actor, "email": os.environ["ACTOR_ID"] + "+" + actor + "@users.noreply.github.com"},
          }
          Path(request).write_text(json.dumps(body), encoding="utf-8")
          PY
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)
            if [ "$move_tag" = true ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --silent
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha" --silent
          fi
      - name: Dispatch release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if ! gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"; then
            echo "::error::tag exists but dispatch failed; rerun Cut release on main or dispatch release.yml on v$VERSION"
            exit 1
          fi
