apiVersion: v1
kind: Pod
metadata:
  name: debug
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: shell
      image: busybox:latest
      ports:
        - containerPort: 80
          hostPort: 80
      securityContext:
        privileged: true
        runAsUser: 0
        capabilities:
          add: [SYS_ADMIN]
      volumeMounts:
        - name: root
          mountPath: /host
  volumes:
    - name: root
      hostPath:
        path: /
