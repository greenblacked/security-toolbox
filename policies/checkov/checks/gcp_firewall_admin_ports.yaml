metadata:
  id: CKV2_STB_GCP_2
  name: GCP firewall does not open SSH or RDP to 0.0.0.0/0
  category: NETWORKING
definition:
  or:
    - cond_type: attribute
      resource_types: [google_compute_firewall]
      attribute: source_ranges
      operator: not_contains
      value: 0.0.0.0/0
    - and:
        - cond_type: attribute
          resource_types: [google_compute_firewall]
          attribute: allow.*.ports
          operator: not_contains
          value: "22"
        - cond_type: attribute
          resource_types: [google_compute_firewall]
          attribute: allow.*.ports
          operator: not_contains
          value: "3389"
